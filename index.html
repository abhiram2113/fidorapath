<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Google Search Console Verification -->
  <meta
    name="google-site-verification"
    content="YOUR_EXISTING_GOOGLE_VERIFICATION_CODE"
  />

  <!-- Mobile / Responsive -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- SEO Title -->
  <title>FidoraPath | US Jobs & Job Application Services</title>

  <!-- SEO Description -->
  <meta
    name="description"
    content="FidoraPath helps IT professionals find US jobs through professional job application services, ATS-friendly digital resumes, LinkedIn optimization, and job consultancy support."
  />

  <!-- Tell Google to index the website -->
  <meta
    name="robots"
    content="index, follow"
  />

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="https://fidorapath.vercel.app/"
  />

  <!-- Open Graph / Social Sharing -->
  <meta
    property="og:title"
    content="FidoraPath | US Jobs & Job Application Services"
  />

  <meta
    property="og:description"
    content="Professional US job applications, ATS-friendly digital resumes, LinkedIn optimization, and job consultancy support for IT professionals."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://fidorapath.vercel.app/"
  />

  <meta
    property="og:site_name"
    content="FidoraPath"
  />

  <!-- Basic SEO Keywords -->
  <meta
    name="keywords"
    content="US jobs, job applications, digital resume, job consultancy, US job consultancy, IT jobs USA, job application services, ATS resume, ATS-friendly resume, LinkedIn optimization"
  />

  <!-- Page Styling -->
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script
    type="module"
    src="/src/main.tsx"
  ></script>
</body>
</html>
